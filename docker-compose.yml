services:
  postgres:
    image: postgres:16-alpine
    container_name: sdlc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sdlc_platform}
      POSTGRES_USER: ${DB_USERNAME:-sdlc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sdlc_password}
    ports:
      - "5433:5432"
    volumes:
      - sdlc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sdlc_user} -d ${DB_NAME:-sdlc_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: sdlc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sdlc_platform}
      DB_USERNAME: ${DB_USERNAME:-sdlc_user}
      DB_PASSWORD: ${DB_PASSWORD:-sdlc_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sdlcplatform.com}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8081:8080"

volumes:
  sdlc_postgres_data:
