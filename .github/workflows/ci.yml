name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sdlc_platform_test
          POSTGRES_USER: sdlc_user
          POSTGRES_PASSWORD: sdlc_password
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U sdlc_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: ./sdlc-platform-backend
        run: mvn -B clean compile

      - name: Run unit tests
        working-directory: ./sdlc-platform-backend
        env:
          JWT_SECRET: test-secret-test-secret-test-secret-test-secret-32chars
        run: mvn -B test

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdlc-platform-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./sdlc-platform-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./sdlc-platform-frontend
        run: npm run build

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: [ backend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        working-directory: ./sdlc-platform-backend
        run: docker build -t sdlc-platform-backend:ci .
